name: Build and validate Trihexoct
"on":
  workflow_dispatch:
    inputs:
      accept_feed_anomaly:
        description: "Accept a source-count anomaly only after reviewing the failed build report"
        required: false
        default: false
        type: boolean
      accept_large_output_change:
        description: "Publish a large rule-set change only after reviewing reports/rule-delta.json"
        required: false
        default: false
        type: boolean
  schedule:
    # UTC; scheduled runs are best-effort and can be delayed by GitHub.
    - cron: "17 */12 * * *"
  push:
    branches: [main]
    paths:
      - "src/modules/**"
      - "config/reference_feeds.json"
      - "tools/**"
      - "tests/**"
      - "requirements-ci.txt"
      - "docs/**"
      - ".github/workflows/**"
      - "README.md"
      - "README_START_HERE.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "SECURITY_MODEL.md"
      - "reports/coverage_policy.md"
      - "VERSION"

# Restrictive default; only the publishing job receives write permission.
permissions:
  contents: read

concurrency:
  group: trihexoct-main-publisher
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Test, reconcile, validate, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          check-latest: false

      - name: Install CI-only YAML validator
        run: python -m pip install --disable-pip-version-check --requirement requirements-ci.txt

      - name: Validate workflow YAML and step structure
        run: python tools/validate_workflows.py

      - name: Verify complete project layout
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "VERSION"
            "Trihexoct.txt"
            "Trihexoct.meta.json"
            "config/reference_feeds.json"
            "tools/build_filter.py"
            "tools/validate_filter.py"
            "tools/audit_source_modules.py"
            "tools/validate_workflows.py"
            "tools/write_summary.py"
            "tests/test_filter_project.py"
            "src/modules/10-url-tracking-parameters.txt"
          )
          missing=()
          for path in "${required[@]}"; do
            if [[ ! -f "$path" ]]; then
              missing+=("$path")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing required project files:\n'
            printf '  - %s\n' "${missing[@]}"
            echo 'Upload the complete project while preserving its folders; main.yml alone is not the complete updater.' >&2
            exit 2
          fi
          if ! compgen -G 'src/modules/*.txt' > /dev/null; then
            echo '::error::No source modules found in src/modules/.'
            exit 2
          fi
          echo 'Complete project layout verified.'

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Audit source modules
        run: python tools/audit_source_modules.py --output reports/source-inventory.json

      - name: Check repository whitespace
        run: git diff --check

      - name: Fetch reference feeds, reconcile overlap, and build
        shell: bash
        env:
          ACCEPT_FEED_ANOMALY: ${{ inputs.accept_feed_anomaly }}
          ACCEPT_LARGE_OUTPUT_CHANGE: ${{ inputs.accept_large_output_change }}
        run: |
          set -euo pipefail
          rm -f reports/rule-delta.json
          args=(
            --fetch-references
            --require-primary
            --workers 8
            --retries 2
            --output Trihexoct.txt
            --report reports/build-report.json
          )
          if [[ "${ACCEPT_FEED_ANOMALY:-false}" == "true" ]]; then
            args+=(--accept-feed-anomaly)
          fi
          if [[ "${ACCEPT_LARGE_OUTPUT_CHANGE:-false}" == "true" ]]; then
            args+=(--accept-large-output-change)
          fi
          python tools/build_filter.py "${args[@]}"

      - name: Validate generated Brave list and manifest
        run: python tools/validate_filter.py Trihexoct.txt

      - name: Rebuild source inventory after reconciliation
        run: python tools/audit_source_modules.py --output reports/source-inventory.json

      - name: Write build summary
        if: always()
        run: python tools/write_summary.py reports/build-report.json

      - name: Upload diagnostics even when validation fails
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trihexoct-build-report-${{ github.run_number }}
          path: |
            reports/build-report.json
            reports/rule-delta.json
            reports/source-inventory.json
          if-no-files-found: warn
          retention-days: 30

      - name: Commit validated list, manifest, and rolling baseline
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git add Trihexoct.txt Trihexoct.meta.json reports/reference-feed-baseline.json reports/source-inventory.json reports/rule-delta.json
          if git diff --cached --quiet; then
            echo "No validated list, manifest, baseline, or audit changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(filters): refresh validated Trihexoct list"
          git push origin HEAD:main
